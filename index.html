<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remote PC Viewer</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --green: #22c55e;
      --red: #ef4444;
      --line: rgba(255,255,255,0.08);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #020617 0%, var(--bg) 100%);
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app {
      width: min(1100px, 100%);
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(17, 24, 39, 0.95);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: bold;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.9);
    }

    .status {
      color: var(--muted);
      font-size: 14px;
    }

    .content {
      padding: 22px;
    }

    .screen-wrap {
      position: relative;
      width: 100%;
      height: 70vh;
      min-height: 420px;
      border-radius: 16px;
      overflow: hidden;
      background: #020817;
      border: 1px solid var(--line);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: none;
      background: #020817;
    }

    canvas.visible {
      display: block;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.96));
      padding: 24px;
    }

    .placeholder.hidden {
      display: none;
    }

    .disconnect {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 10;
      border: none;
      border-radius: 10px;
      background: linear-gradient(180deg, #ef4444, #dc2626);
      color: white;
      font-weight: bold;
      padding: 10px 18px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(239,68,68,0.35);
    }

    .disconnect:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .disconnected-msg {
      display: none;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 10px;
      background: rgba(127, 29, 29, 0.25);
      color: #fecaca;
      border: 1px dashed rgba(239,68,68,0.5);
      font-weight: 600;
    }

    .disconnected-msg.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <span class="dot"></span>
        <span>Remote Control</span>
      </div>
      <div class="status" id="statusText">Waiting for PC</div>
    </div>

    <div class="content">
      <div class="screen-wrap" id="screenWrap">
        <button class="disconnect" id="disconnectBtn" type="button">Disconnect</button>
        <canvas id="screenCanvas" width="1280" height="720"></canvas>

        <div class="placeholder" id="placeholder">
          <div>
            <h2>Awaiting remote PC connection</h2>
            <p>The Python client will connect here and stream the screen live.</p>
          </div>
        </div>
      </div>

      <div class="disconnected-msg" id="disconnectedMsg">
        Live feed disconnected.
      </div>
    </div>
  </div>

  <script>
    const socketUrl = "wss://your-public-relay.example/ws";
    const canvas = document.getElementById("screenCanvas");
    const ctx = canvas.getContext("2d");
    const placeholder = document.getElementById("placeholder");
    const statusText = document.getElementById("statusText");
    const disconnectBtn = document.getElementById("disconnectBtn");
    const disconnectedMsg = document.getElementById("disconnectedMsg");

    let socket = null;
    let connected = false;

    function setPlaceholder(show) {
      placeholder.classList.toggle("hidden", !show);
    }

    function setCanvasVisible(show) {
      canvas.classList.toggle("visible", show);
    }

    function renderFrame(dataUrl) {
      const img = new Image();
      img.onload = function () {
        const ratio = Math.min(canvas.width / img.width, canvas.height / img.height);
        const w = img.width * ratio;
        const h = img.height * ratio;
        const x = (canvas.width - w) / 2;
        const y = (canvas.height - h) / 2;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, x, y, w, h);

        setCanvasVisible(true);
        setPlaceholder(false);
        statusText.textContent = "Live stream connected";
      };
      img.src = dataUrl;
    }

    function connect() {
      socket = new WebSocket(socketUrl);

      socket.onopen = () => {
        connected = true;
        statusText.textContent = "Connecting to PC...";
        socket.send(JSON.stringify({ type: "hello", role: "browser" }));
      };

      socket.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);

          if (msg.type === "frame" && msg.image) {
            renderFrame("data:image/jpeg;base64," + msg.image);
          }

          if (msg.type === "status") {
            statusText.textContent = msg.text;
          }
        } catch (err) {
          console.error("Bad message:", err);
        }
      };

      socket.onclose = () => {
        connected = false;
        statusText.textContent = "Disconnected";
        setPlaceholder(true);
        setCanvasVisible(false);
        disconnectedMsg.classList.add("visible");
      };

      socket.onerror = () => {
        statusText.textContent = "Connection error";
      };
    }

    function disconnectStream() {
      if (socket) socket.close();
      disconnectBtn.disabled = true;
      disconnectedMsg.classList.add("visible");
      statusText.textContent = "Disconnected";
    }

    disconnectBtn.addEventListener("click", disconnectStream);

    connect();
  </script>
</body>
</html>
